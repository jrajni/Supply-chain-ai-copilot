name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Build Next.js application
        run: npm run build
        env:
          SupplyChain_DATABASE_URL: ${{ secrets.SUPPLYCHAIN_DATABASE_URL }}
          SupplyChain_POSTGRES_URL: ${{ secrets.SUPPLYCHAIN_POSTGRES_URL }}
          SupplyChain_PRISMA_DATABASE_URL: ${{ secrets.SUPPLYCHAIN_PRISMA_DATABASE_URL }}
          GROQ_API_KEY: ${{ secrets.SUPPLYCHAIN_GROQ_API_KEY }}
          GROQ_MODEL: ${{ secrets.SUPPLYCHAIN_GROQ_MODEL }}
